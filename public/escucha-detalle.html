<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Neuma | Sonido</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/escucha.css">
    
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo"><img src="assets/images/neuma_logo.svg" alt="neuma"></a>
        <div class="nav-right">
            <nav class="desktop-links">
                <a href="index.html">Inicio</a>
                <a href="origen.html">Origen</a>
                <a href="equipo.html">Equipo</a>
            </nav>
            <div class="menu-toggle" id="menu-toggle"><span></span><span></span><span></span></div>
        </div>
        <div class="dropdown-menu" id="dropdown-menu">
            <a href="index.html">Inicio</a>
            <a href="medita.html">Medita</a>
            <a href="origen.html">Origen</a>
            <a href="escucha.html">Escucha</a>
            <a href="equipo.html">Equipo</a>
            <a href="siente.html">Siente</a>
            <a href="comunidad.html">Comunidad</a>
        </div>
    </header>

    <main>
        <section class="sound-detail-page">
            <div class="sound-detail-container" id="soundDetailContainer">
                <p style="text-align:center; padding: 3rem;">Cargando sonido...</p>
            </div>
        </section>
    </main>

    <footer class="simple-footer">
        <a href="index.html" class="footer-logo">
        <img src="assets/images/neuma_logo.svg" alt="neuma">
        </a>
  
        <div class="footer-separator"></div>
  
        <div class="footer-links">
            <a href="origen.html">Origen</a>
            <a href="equipo.html">Equipo</a>
            <a href="comunidad.html">Comunidad</a>
    
            <a href="medita.html">Medita</a>
            <a href="siente.html">Siente</a>
            <a href="escucha.html">Escucha</a>
        </div>
    </footer>

    <script src="js/navbar.js"></script>
    <script>
        // Obtener ID del sonido desde la URL
        const urlParams = new URLSearchParams(window.location.search);
        const soundId = urlParams.get('id');

        if (!soundId) {
            // Si no hay ID, mostrar error y redirigir
            document.getElementById('soundDetailContainer').innerHTML = `
                <div style="text-align:center; padding: 3rem;">
                    <h2>Sonido no encontrado</h2>
                    <p>No se especificó qué sonido mostrar.</p>
                    <a href="escucha.html" class="btn-back">← Volver a Escucha</a>
                </div>
            `;
        } else {
            // Cargar datos del sonido
            loadSoundDetail(soundId);
        }

        async function loadSoundDetail(id) {
            try {
                const res = await fetch(`/api/sounds/${id}`);

                if (!res.ok) {
                    if (res.status === 404) {
                        throw new Error('Sonido no encontrado');
                    } else {
                        throw new Error('Error al cargar el sonido');
                    }
                }

                const sound = await res.json();
                renderSoundDetail(sound);
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('soundDetailContainer').innerHTML = `
                    <div style="text-align:center; padding: 3rem;">
                        <h2>Error</h2>
                        <p>${err.message}</p>
                        <a href="escucha.html" class="btn-back">← Volver a Escucha</a>
                    </div>
                `;
            }
        }

        function renderSoundDetail(sound) {
            const container = document.getElementById('soundDetailContainer');

            // Actualizar título de la página
            document.getElementById('pageTitle').textContent = `Neuma | ${sound.title}`;

            // Imagen de portada
            const imgSrc = sound.coverImage?.url || 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=1200&q=80';

            // URL del audio
            const audioSrc = sound.audioFile?.url || '';

            container.innerHTML = `
                <!-- Imagen ampliada con controles -->
                <div class="sound-detail-image">
                    <img src="${imgSrc}" alt="${sound.title}" class="detail-bg-image">

                    <!-- Controles de audio superpuestos -->
                    <div class="sound-detail-controls">
                        <button class="audio-btn-large prev" id="prevBtn">⏮</button>
                        <button class="audio-btn-large play" id="playBtn">▶</button>
                        <button class="audio-btn-large next" id="nextBtn">⏭</button>
                    </div>
                </div>

                <!-- Título -->
                <h1 class="sound-detail-title">${sound.title}</h1>

                <!-- Descripción -->
                <div class="sound-detail-description">
                    <p>${sound.description}</p>
                </div>

                <!-- Botón volver -->
                <a href="escucha.html" class="btn-back">← Volver a Escucha</a>

                <!-- Audio oculto -->
                <audio id="audioPlayer" src="${audioSrc}"></audio>
            `;

            // Event listeners para los controles
            const audio = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('playBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                    playBtn.textContent = '❚❚';
                    playBtn.classList.remove('play');
                    playBtn.classList.add('pause');
                } else {
                    audio.pause();
                    playBtn.textContent = '▶';
                    playBtn.classList.remove('pause');
                    playBtn.classList.add('play');
                }
            });

            prevBtn.addEventListener('click', () => {
                audio.currentTime = Math.max(0, audio.currentTime - 10);
            });

            nextBtn.addEventListener('click', () => {
                audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
            });
        }
    </script>
</body>

</html>
