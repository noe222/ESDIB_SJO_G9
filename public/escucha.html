  <script src="js/navbar.js"></script>
  <script>
    // Control de reproducción de audio
    function togglePlay(btn) {
      const card = btn.closest('.sound-card');
      const audio = card.querySelector('audio');

      // Pausar todos los demás audios
      document.querySelectorAll('.sound-card audio').forEach(a => {
        if (a !== audio) {
          a.pause();
          a.currentTime = 0;
        }
      });

      // Cambiar todos los botones a play
      document.querySelectorAll('.audio-btn.pause').forEach(b => {
        b.classList.remove('pause');
        b.classList.add('play');
      });

      // Toggle play/pause del actual
      if (audio.paused) {
        audio.play();
        btn.classList.remove('play');
        btn.classList.add('pause');
      } else {
        audio.pause();
        btn.classList.remove('pause');
        btn.classList.add('play');
      }
    }

    function prevTrack(btn) {
      const card = btn.closest('.sound-card');
      const audio = card.querySelector('audio');
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    }

    function nextTrack(btn) {
      const card = btn.closest('.sound-card');
      const audio = card.querySelector('audio');
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    }
  </script>
