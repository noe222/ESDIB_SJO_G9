<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>Pets</title>
  <style>
    /* Mini estilos para la galería */
    .pet-item { margin-bottom: 14px; }
    .pet-header { margin-bottom: 6px; }
    .pet-photos { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 0 0; padding: 0; }
    .pet-photos img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .pet-actions button { margin-left: 8px; }
    .muted { color: #666; font-size: 0.9em; }
  </style>
</head>

<body>
  <div class="main_content">
    <div class="header">
      <div class="header_contenido">
        <div class="logo">
          <span class="logo_header">
            <a class="link_logo_header" href="" target="_blank"><img src=""></a>
          </span>
        </div>
        <div class="nav_container">
          <span href="" class="nav_item">ALTA PET</span>
        </div>
      </div>
    </div>
  </div>

  <div class="main_container" id="main_content">
    <div class="title">UPLOAD PET</div>
    <div class="formulario">
      <form id="alta_pet">
        <div class="input_container">
          <label>Animal</label>
          <input type="text" name="animal" id="animal" placeholder="Perro o Gato" autocomplete="off">
        </div>
        <div class="input_container">
          <label>Nombre</label>
          <input type="text" name="nombre" id="nombre" placeholder="Tobby" autocomplete="off">
        </div>
        <div class="input_container">
          <label>Raza</label>
          <input type="text" name="raza" id="raza" placeholder="Golden Retriever" autocomplete="off">
        </div>
        <div class="input_container">
          <label>Collar</label>
          <input type="text" name="collar" id="collar" placeholder="1" autocomplete="off">
        </div>
        <div class="input_container">
          <label>Edad</label>
          <input type="text" name="edad" id="edad" placeholder="1" autocomplete="off">
        </div>
        <div class="input_container">
          <label>Pelo</label>
          <select name="pelo" id="pelo">
            <option value="">Tipo de pelo</option>
            <option value="Corto">Corto</option>
            <option value="Largo">Largo</option>
          </select>
        </div>
        <div class="input_container">
          <label>Tamaño</label>
          <select name="tamaño" id="tamaño">
            <option value="">Tamaño</option>
            <option value="Pequeño">Pequeño</option>
            <option value="Mediano">Mediano</option>
            <option value="Grande">Grande</option>
          </select>
        </div>
        <div class="input_container">
          <label>Color</label>
          <select name="color1" id="color">
            <option value="">Color</option>
            <option value="Negro">Negro</option>
            <option value="Blanco">Blanco</option>
            <option value="Marrón">Marrón</option>
          </select>
        </div>
        <div class="input_container">
          <label>Sexo</label>
          <select name="sexo" id="sexo">
            <option value="">Sexo</option>
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
          </select>
        </div>
        <div class="input_container">
          <label>Fecha llegada</label>
          <input type="date" name="fecha" id="fecha" autocomplete="off">
        </div>
        <div class="input_container">
          <label>Descripcion</label>
          <textarea cols="22" rows="3" type="text" name="descripcion" id="descripcion" placeholder="..." autocomplete="off"></textarea>
        </div>
        <div class="input_container">
          <label>Fotos</label>
          <input type="file" name="file" id="files" placeholder="pictures..." multiple>
        </div>

        <div class="input_container_button">
          <button id="upload-button" type="submit"><label>SUBIR</label></button>
          <button id="cancel-edit" type="button" style="display:none; margin-left:8px;">Cancelar edición</button>
        </div>
      </form>

      <h2>Lista</h2>
      <ul id="pets-list"></ul>
    </div>
  </div>

<script src="app.js" defer></script>
</body>
</html>
